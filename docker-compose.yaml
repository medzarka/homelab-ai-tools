services:
  # ========================================================
  # WORKSPACE STORAGE INITIALIZER & HEALTH GUARD
  # ========================================================
  tools-workspace-init:
    image: alpine:latest
    container_name: compute_tools_workspace_init_${NODE_NAME:-tools}
    user: "0:0"
    restart: unless-stopped
    network_mode: none
    volumes:
      - ${WORKSPACE_DIR:-/srv/data/workspace}:/workspace
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo ">>> [Tools Workspace Init] Preparing service directories in ${WORKSPACE_DIR:-/srv/data/workspace}..."
        mkdir -p /workspace/ollama /workspace/onlyoffice/data /workspace/onlyoffice/log /workspace/searxng /workspace/firecrawl/postgres /workspace/firecrawl/redis /workspace/firecrawl/rabbitmq /workspace/speaches /workspace/tei-embed /workspace/tei-rerank
        chmod -R 777 /workspace/ollama /workspace/onlyoffice /workspace/searxng /workspace/speaches /workspace/tei-embed /workspace/tei-rerank /workspace/firecrawl/redis /workspace/firecrawl/rabbitmq
        chmod 700 /workspace/firecrawl/postgres
        if [ ! -f /workspace/searxng/settings.yml ]; then
          echo ">>> [Tools Workspace Init] Generating initial SearXNG configuration..."
          cat << 'EOF' > /workspace/searxng/settings.yml
        use_default_settings: true
        search:
          autocomplete: google
          formats:
            - html
            - json
        server:
          port: 8080
          bind_address: 0.0.0.0
          secret_key: "${SEARXNG_SECRET}"
          limiter: false
          image_proxy: true
        EOF
          chmod 666 /workspace/searxng/settings.yml
        fi
        echo ">>> [Tools Workspace Init] Storage initialization complete. Guard active."
        sleep infinity
    healthcheck:
      test: ["CMD-SHELL", "test -d /workspace/ollama && test -d /workspace/searxng || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  # ========================================================
  # OLLAMA (Local AI Vision & Chat Engine)
  # ========================================================
  ollama:
    image: ollama/ollama:latest
    container_name: compute_ollama_${NODE_NAME:-tools}
    restart: unless-stopped
    depends_on:
      tools-workspace-init:
        condition: service_healthy
    volumes:
      - ${WORKSPACE_DIR:-/srv/data/workspace}/ollama:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0:11434
      - OLLAMA_API_KEY=${OLLAMA_API_KEY:-}
      - OLLAMA_NUM_PARALLEL=${OLLAMA_NUM_PARALLEL:-1}
      - OLLAMA_MAX_LOADED_MODELS=${OLLAMA_MAX_LOADED_MODELS:-2}
      - OLLAMA_KEEP_ALIVE=${OLLAMA_KEEP_ALIVE:-24h}
      - OMP_NUM_THREADS=${OMP_NUM_THREADS:-12}
    expose:
      - 11434
    networks:
      shared_net:
        aliases:
          - ollama
          - compute_ollama
          - ollama-${NODE_NAME:-tools}
      homelab_swarm_net:
        aliases:
          - ollama
          - compute_ollama
          - ollama-${NODE_NAME:-tools}
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.ollama.rule=Host(`ollama.${ROOT_DOMAIN:-example.com}`)"
      - "traefik.http.routers.ollama.entrypoints=websecure"
      - "traefik.http.routers.ollama.tls=true"
      - "traefik.http.routers.ollama.middlewares=app-fail2ban@file,security-headers@file"
      - "traefik.http.services.ollama.loadbalancer.server.port=11434"
      - "traefik.docker.network=${SWARM_NETWORK:-homelab_swarm_net}"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ========================================================
  # OLLAMA BOOTSTRAP (Auto-Pulls Configured Models on Boot)
  # ========================================================
  ollama-init:
    image: alpine:latest
    container_name: compute_ollama_init_${NODE_NAME:-tools}
    restart: "no"
    depends_on:
      ollama:
        condition: service_healthy
    networks:
      - shared_net
    environment:
      - OLLAMA_INIT_MODELS=${OLLAMA_INIT_MODELS:-qwen2.5vl:3b,hermes3:8b}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        apk add --no-cache curl >/dev/null 2>&1
        echo ">>> [Ollama Init] Checking configured models: $${OLLAMA_INIT_MODELS}..."
        IFS=','
        for model in $${OLLAMA_INIT_MODELS}; do
          echo ">>> [Ollama Init] Ensuring model '$$model' is loaded..."
          curl -s -X POST http://ollama:11434/api/pull -d "{\"name\": \"$$model\", \"stream\": false}" >/dev/null 2>&1 || true
          echo ">>> [Ollama Init] Model '$$model' verified."
        done
        echo ">>> [Ollama Init] All required AI models are warm and ready."

  # ========================================================
  # ONLYOFFICE DOCUMENT SERVER (Single-User Lean Edition)
  # ========================================================
  onlyoffice:
    image: onlyoffice/documentserver:latest
    container_name: compute_onlyoffice_${NODE_NAME:-tools}
    restart: unless-stopped
    depends_on:
      tools-workspace-init:
        condition: service_healthy
    volumes:
      - ${WORKSPACE_DIR:-/srv/data/workspace}/onlyoffice/data:/var/lib/onlyoffice
      - ${WORKSPACE_DIR:-/srv/data/workspace}/onlyoffice/log:/var/log/onlyoffice
    environment:
      - JWT_ENABLED=true
      - JWT_SECRET=${ONLYOFFICE_JWT_SECRET:-}
      - JWT_HEADER=Authorization
      - JWT_IN_BODY=true
      - USE_UNAUTHORIZED_STORAGE=true
      - WOPI_ENABLED=false
      - PRODUCT_NAME=OnlyOffice Homelab
    expose:
      - 80
    networks:
      shared_net:
        aliases:
          - onlyoffice
          - compute_onlyoffice
          - onlyoffice-${NODE_NAME:-tools}
      homelab_swarm_net:
        aliases:
          - onlyoffice
          - compute_onlyoffice
          - onlyoffice-${NODE_NAME:-tools}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1/healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 45s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.onlyoffice.rule=Host(`onlyoffice.${ROOT_DOMAIN:-example.com}`)"
      - "traefik.http.routers.onlyoffice.entrypoints=websecure"
      - "traefik.http.routers.onlyoffice.tls=true"
      - "traefik.http.routers.onlyoffice.middlewares=app-fail2ban@file,onlyoffice-headers@file"
      - "traefik.http.services.onlyoffice.loadbalancer.server.port=80"
      - "traefik.docker.network=${SWARM_NETWORK:-homelab_swarm_net}"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ========================================================
  # SEARXNG (Private Metasearch Engine)
  # ========================================================
  searxng:
    image: searxng/searxng:latest
    container_name: compute_searxng_${NODE_NAME:-tools}
    restart: unless-stopped
    depends_on:
      tools-workspace-init:
        condition: service_healthy
    volumes:
      - ${WORKSPACE_DIR:-/srv/data/workspace}/searxng:/etc/searxng
    environment:
      - SEARXNG_BASE_URL=http://searxng:8080/
      - SEARXNG_SECRET=${SEARXNG_SECRET:-}
      - UWSGI_WORKERS=4
      - UWSGI_THREADS=4
    expose:
      - 8080
    networks:
      shared_net:
        aliases:
          - searxng
          - compute_searxng
          - searxng-${NODE_NAME:-tools}
      homelab_swarm_net:
        aliases:
          - searxng
          - compute_searxng
          - searxng-${NODE_NAME:-tools}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.searxng.rule=Host(`search.${ROOT_DOMAIN:-example.com}`, `searxng.${ROOT_DOMAIN:-example.com}`)"
      - "traefik.http.routers.searxng.entrypoints=websecure"
      - "traefik.http.routers.searxng.tls=true"
      - "traefik.http.routers.searxng.middlewares=app-fail2ban@file,security-headers@file"
      - "traefik.http.services.searxng.loadbalancer.server.port=8080"
      - "traefik.docker.network=${SWARM_NETWORK:-homelab_swarm_net}"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ========================================================
  # FIRECRAWL STACK (Web Scraper & Crawler Services)
  # ========================================================
  firecrawl-postgres:
    image: postgres:16-alpine
    container_name: compute_firecrawl_postgres_${NODE_NAME:-tools}
    restart: unless-stopped
    depends_on:
      tools-workspace-init:
        condition: service_healthy
    environment:
      POSTGRES_USER: ${NUQ_USER:-nuq_user}
      POSTGRES_PASSWORD: ${NUQ_PASSWORD:-}
      POSTGRES_DB: ${NUQ_DB:-nuq_db}
    volumes:
      - ${WORKSPACE_DIR:-/srv/data/workspace}/firecrawl/postgres:/var/lib/postgresql/data
    networks:
      shared_net:
        aliases:
          - firecrawl-postgres
          - compute_firecrawl_postgres
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  firecrawl-redis:
    image: redis:alpine
    container_name: compute_firecrawl_redis_${NODE_NAME:-tools}
    restart: unless-stopped
    depends_on:
      tools-workspace-init:
        condition: service_healthy
    volumes:
      - ${WORKSPACE_DIR:-/srv/data/workspace}/firecrawl/redis:/data
    networks:
      shared_net:
        aliases:
          - firecrawl-redis
          - compute_firecrawl_redis
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  firecrawl-rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: compute_firecrawl_rabbitmq_${NODE_NAME:-tools}
    restart: unless-stopped
    depends_on:
      tools-workspace-init:
        condition: service_healthy
    environment:
      RABBITMQ_DEFAULT_USER: ${NUQ_USER:-nuq_user}
      RABBITMQ_DEFAULT_PASS: ${NUQ_PASSWORD:-}
      RABBITMQ_NODENAME: rabbit@localhost
      RABBITMQ_ERLANG_COOKIE: ${RABBITMQ_ERLANG_COOKIE:-}
    volumes:
      - ${WORKSPACE_DIR:-/srv/data/workspace}/firecrawl/rabbitmq:/var/lib/rabbitmq
    networks:
      shared_net:
        aliases:
          - firecrawl-rabbitmq
          - compute_firecrawl_rabbitmq
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  firecrawl-playwright:
    image: ghcr.io/firecrawl/playwright-service:latest
    container_name: compute_firecrawl_playwright_${NODE_NAME:-tools}
    restart: unless-stopped
    environment:
      - PORT=3000
    networks:
      shared_net:
        aliases:
          - firecrawl-playwright
          - compute_firecrawl_playwright
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  firecrawl-api:
    image: ghcr.io/firecrawl/firecrawl:latest
    container_name: compute_firecrawl_api_${NODE_NAME:-tools}
    restart: unless-stopped
    command: ["node", "dist/src/index.js"]
    expose:
      - 3036
    environment:
      - PORT=3036
      - HOST=0.0.0.0
      - REDIS_URL=redis://firecrawl-redis:6379
      - REDIS_RATE_LIMIT_URL=redis://firecrawl-redis:6379
      - PLAYWRIGHT_MICROSERVICE_URL=http://firecrawl-playwright:3000/scrape
      - USE_PLAYWRIGHT=true
      - FIRECRAWL_API_KEY=${FIRECRAWL_API_KEY:-}
      - NUQ_DATABASE_URL=postgresql://${NUQ_USER:-nuq_user}:${NUQ_PASSWORD:-}@firecrawl-postgres:5432/${NUQ_DB:-nuq_db}
      - NUQ_RABBITMQ_URL=amqp://${NUQ_USER:-nuq_user}:${NUQ_PASSWORD:-}@firecrawl-rabbitmq:5672/
    depends_on:
      - firecrawl-redis
      - firecrawl-playwright
      - firecrawl-postgres
      - firecrawl-rabbitmq
    networks:
      shared_net:
        aliases:
          - firecrawl-api
          - compute_firecrawl_api
          - firecrawl-api-${NODE_NAME:-tools}
      homelab_swarm_net:
        aliases:
          - firecrawl-api
          - compute_firecrawl_api
          - firecrawl-api-${NODE_NAME:-tools}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.firecrawl.rule=Host(`scraper.${ROOT_DOMAIN:-example.com}`, `firecrawl.${ROOT_DOMAIN:-example.com}`)"
      - "traefik.http.routers.firecrawl.entrypoints=websecure"
      - "traefik.http.routers.firecrawl.tls=true"
      - "traefik.http.routers.firecrawl.middlewares=app-fail2ban@file,security-headers@file"
      - "traefik.http.services.firecrawl.loadbalancer.server.port=3036"
      - "traefik.docker.network=${SWARM_NETWORK:-homelab_swarm_net}"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  firecrawl-worker:
    image: ghcr.io/firecrawl/firecrawl:latest
    container_name: compute_firecrawl_worker_${NODE_NAME:-tools}
    restart: unless-stopped
    command: ["node", "dist/src/services/queue-worker.js"]
    environment:
      - REDIS_URL=redis://firecrawl-redis:6379
      - REDIS_RATE_LIMIT_URL=redis://firecrawl-redis:6379
      - PLAYWRIGHT_MICROSERVICE_URL=http://firecrawl-playwright:3000/scrape
      - USE_PLAYWRIGHT=true
      - NUM_WORKERS_PER_QUEUE=2
      - NUQ_DATABASE_URL=postgresql://${NUQ_USER:-nuq_user}:${NUQ_PASSWORD:-}@firecrawl-postgres:5432/${NUQ_DB:-nuq_db}
      - NUQ_RABBITMQ_URL=amqp://${NUQ_USER:-nuq_user}:${NUQ_PASSWORD:-}@firecrawl-rabbitmq:5672/
    depends_on:
      - firecrawl-redis
      - firecrawl-playwright
      - firecrawl-postgres
      - firecrawl-rabbitmq
    networks:
      - shared_net
      - homelab_swarm_net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ========================================================
  # SPEACHES (OpenAI-Compatible STT & TTS)
  # Faster-Whisper + Kokoro-82M
  # ========================================================
  speaches:
    image: ghcr.io/speaches-ai/speaches:latest-cpu
    container_name: compute_speaches_${NODE_NAME:-tools}
    restart: unless-stopped
    depends_on:
      tools-workspace-init:
        condition: service_healthy
    volumes:
      - ${WORKSPACE_DIR:-/srv/data/workspace}/speaches:/home/speaches/.cache
    environment:
      - API_KEY=${SPEACHES_API_KEY:-}
      - WHISPER__MODEL=Systran/faster-whisper-large-v3
      - WHISPER__DEVICE=cpu
      - WHISPER__COMPUTE_TYPE=int8
      - WHISPER__CPU_THREADS=${WHISPER_CPU_THREADS:-8}
      - KOKORO__DEVICE=cpu
      - LOOPBACK_HOST_URL=http://localhost:8000
      - OMP_NUM_THREADS=${OMP_NUM_THREADS:-12}
      - RAYON_NUM_THREADS=${RAYON_NUM_THREADS:-12}
    expose:
      - 8000
    networks:
      shared_net:
        aliases:
          - speaches
          - compute_speaches
          - speaches-${NODE_NAME:-tools}
      homelab_swarm_net:
        aliases:
          - speaches
          - compute_speaches
          - speaches-${NODE_NAME:-tools}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.speaches.rule=Host(`audio.${ROOT_DOMAIN:-example.com}`, `voice.${ROOT_DOMAIN:-example.com}`, `speaches.${ROOT_DOMAIN:-example.com}`)"
      - "traefik.http.routers.speaches.entrypoints=websecure"
      - "traefik.http.routers.speaches.tls=true"
      - "traefik.http.routers.speaches.middlewares=app-fail2ban@file,security-headers@file"
      - "traefik.http.services.speaches.loadbalancer.server.port=8000"
      - "traefik.docker.network=${SWARM_NETWORK:-homelab_swarm_net}"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ========================================================
  # HUGGING FACE TEI (Text Embeddings Inference)
  # High-throughput Rust engine for BAAI/bge-m3
  # ========================================================
  embeddings:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.6
    container_name: compute_embeddings_${NODE_NAME:-tools}
    restart: unless-stopped
    depends_on:
      tools-workspace-init:
        condition: service_healthy
    command: ["--model-id", "BAAI/bge-m3", "--auto-truncate"]
    volumes:
      - ${WORKSPACE_DIR:-/srv/data/workspace}/tei-embed:/data
    environment:
      - API_KEY=${TEI_API_KEY:-}
      - OMP_NUM_THREADS=${OMP_NUM_THREADS:-12}
      - RAYON_NUM_THREADS=${RAYON_NUM_THREADS:-12}
    expose:
      - 80
    networks:
      shared_net:
        aliases:
          - embeddings
          - compute_embeddings
          - tei-embed
          - embeddings-${NODE_NAME:-tools}
      homelab_swarm_net:
        aliases:
          - embeddings
          - compute_embeddings
          - tei-embed
          - embeddings-${NODE_NAME:-tools}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.embeddings.rule=Host(`embeddings.${ROOT_DOMAIN:-example.com}`)"
      - "traefik.http.routers.embeddings.entrypoints=websecure"
      - "traefik.http.routers.embeddings.tls=true"
      - "traefik.http.routers.embeddings.middlewares=app-fail2ban@file,security-headers@file"
      - "traefik.http.services.embeddings.loadbalancer.server.port=80"
      - "traefik.docker.network=${SWARM_NETWORK:-homelab_swarm_net}"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ========================================================
  # HUGGING FACE TEI (Cross-Encoder Reranker Inference)
  # High-throughput Rust engine for BAAI/bge-reranker-v2-m3
  # ========================================================
  reranker:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.6
    container_name: compute_reranker_${NODE_NAME:-tools}
    restart: unless-stopped
    depends_on:
      tools-workspace-init:
        condition: service_healthy
    command: ["--model-id", "BAAI/bge-reranker-v2-m3", "--auto-truncate"]
    volumes:
      - ${WORKSPACE_DIR:-/srv/data/workspace}/tei-rerank:/data
    environment:
      - API_KEY=${TEI_API_KEY:-}
      - OMP_NUM_THREADS=${OMP_NUM_THREADS:-12}
      - RAYON_NUM_THREADS=${RAYON_NUM_THREADS:-12}
    expose:
      - 80
    networks:
      shared_net:
        aliases:
          - reranker
          - compute_reranker
          - tei-rerank
          - reranker-${NODE_NAME:-tools}
      homelab_swarm_net:
        aliases:
          - reranker
          - compute_reranker
          - tei-rerank
          - reranker-${NODE_NAME:-tools}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.reranker.rule=Host(`reranker.${ROOT_DOMAIN:-example.com}`)"
      - "traefik.http.routers.reranker.entrypoints=websecure"
      - "traefik.http.routers.reranker.tls=true"
      - "traefik.http.routers.reranker.middlewares=app-fail2ban@file,security-headers@file"
      - "traefik.http.services.reranker.loadbalancer.server.port=80"
      - "traefik.docker.network=${SWARM_NETWORK:-homelab_swarm_net}"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  shared_net:
    external: true
    name: ${SHARED_NETWORK:-shared_net}
  homelab_swarm_net:
    external: true
    name: ${SWARM_NETWORK:-homelab_swarm_net}
